apiVersion: apps/v1

kind: Deployment

metadata:
  name: cloudops-api
  namespace: cloudops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-api

  template:
    metadata:
      labels:
        app: cloudops-api

    spec:
      containers:
        - name: cloudops-api
          image: cloudops-lab:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
