apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: cloudops-api
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - cloudops

  selector:
    matchLabels:
      app: cloudops-api

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
