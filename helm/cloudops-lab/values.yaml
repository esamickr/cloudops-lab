replicaCount: 2

image:
  repository: cloudops-lab
  pullPolicy: Never
  tag: "1.2"

serviceAccount:
  create: false
  automount: false

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

httpRoute:
  enabled: false

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: false

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
