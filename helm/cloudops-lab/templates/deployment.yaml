apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudops-lab.fullname" . }}
  labels:
    {{- include "cloudops-lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudops-lab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudops-lab.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: cloudops-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
