apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloudops-lab.fullname" . }}
  labels:
    {{- include "cloudops-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "cloudops-lab.selectorLabels" . | nindent 4 }}
